<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202426">
  <meta name="description" content="Fast, rules-correct scenario and item setup for Halo: Flashpoint.">
  <title>Flashpoint Quick Setup</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <main class="app-shell">
    <header class="brand">
      <img class="brand-logo" src="https://halo.wiki.gallery/images/thumb/0/08/HFP_Logo.png/1200px-HFP_Logo.png" alt="Halo: Flashpoint">
      <p>Quick Setup</p>
    </header>

    <section id="welcome" class="welcome" aria-labelledby="welcome-title">
      <h1 id="welcome-title" class="sr-only">Flashpoint Quick Setup</h1>
      <button id="randomise-all" class="button button-primary" type="button">
        Randomise Scenario &amp; Item Locations
      </button>
    </section>

    <section id="setup" class="setup" aria-live="polite" hidden>
      <div class="scenario-heading">
        <span class="eyebrow">Scenario</span>
        <h1 id="scenario-name"></h1>
        <p id="scenario-note"></p>
      </div>

      <div id="board" class="board" role="grid" aria-label="8 by 8 scenario map"></div>

      <div class="readouts">
        <section class="readout" aria-labelledby="item-heading">
          <h2 id="item-heading">Item Spawn Locations</h2>
          <div id="item-coordinates" class="coordinate-list"></div>
          <p class="readout-note">Duplicate coordinates mean multiple items share that cube.</p>
        </section>

        <section class="readout" aria-labelledby="weapon-heading">
          <h2 id="weapon-heading">Weapon Drop Markers</h2>
          <div id="weapon-coordinates" class="coordinate-list"></div>
          <p class="readout-note">Marker ranges are shuffled onto the four fixed locations.</p>
        </section>
      </div>

      <div class="reroll-controls" aria-label="Reroll controls">
        <button id="reroll-scenario" class="button button-primary" type="button">Re-roll Scenario</button>
        <button id="reroll-items" class="button button-primary" type="button">Re-roll Items</button>
        <button id="reroll-weapons" class="button button-secondary" type="button">Re-shuffle Weapon Markers</button>
      </div>
    </section>

    <nav class="mode-picker" aria-label="Choose a scenario">
      <p>Choose Scenario</p>
      <div id="mode-buttons" class="mode-buttons"></div>
    </nav>

    <details class="legend">
      <summary>Map legend</summary>
      <div class="legend-items">
        <span><i class="legend-swatch item-marker">×</i> Item</span>
        <span><i class="legend-swatch weapon-marker">W</i> Weapon drop</span>
        <span><i class="legend-swatch objective-marker">O</i> Objective</span>
        <span><i class="legend-swatch respawn-marker">◆</i> Respawn</span>
      </div>
    </details>
  </main>

  <noscript>This app needs JavaScript enabled to generate a setup.</noscript>
  <script type="module" src="src/app.js"></script>
</body>
</html>
